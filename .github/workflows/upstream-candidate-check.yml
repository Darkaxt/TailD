name: TailDNS upstream candidate checks

on:
  push:
    branches:
      - automation/upstream-candidate
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate branch to verify with the trusted main workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/automation/upstream-candidate') || (github.event_name == 'workflow_dispatch' && (github.actor == github.repository_owner || github.actor == 'github-actions[bot]') && inputs.candidate_ref == 'automation/upstream-candidate')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.sha }}
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify candidate without signing authority
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/test-reconcile-upstream-core-pin.py
          python3 -B scripts/test-upstream-workflow-composition.py
          bash scripts/test-append-taildns-version.sh
          bash scripts/test-taildns-branding.sh
          bash scripts/test-thor-recents-resilience.sh
          bash scripts/test-sync-core-toolchain-rev.sh
          pwsh -NoProfile -File scripts/test-windows-inplace-upgrade.ps1
          GOTOOLCHAIN=local go mod download tailscale.com
          core_dir="$(GOTOOLCHAIN=local go list -m -f '{{.Dir}}' tailscale.com)"
          test -n "$core_dir"
          bash scripts/sync-core-toolchain-rev.sh --check "$core_dir" "$PWD"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;23.1.7779620'
          version_code_base="$(( $(git show -s --format=%ct HEAD) / 60 * 10 ))"
          test "$version_code_base" -lt 2147483640
          VERSION_CODE_BASE="$version_code_base" make version libtailscale
          make go-test
          core_dir="$(./tool/go list -m -f '{{.Dir}}' tailscale.com)"
          go_bin="$(./tool/go env GOROOT)/bin/go"
          (cd "$core_dir" && "$go_bin" test -mod=readonly ./ipn/... ./net/dns/... ./client/local ./cmd/taildns ./safesocket -count=1)
          (cd android && ./gradlew ktfmtCheck test assembleRelease -PVERSION_CODE_BASE="$version_code_base")
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print android/build/outputs/apk/release/android-release-unsigned.apk > "$RUNNER_TEMP/taildns-merged-manifest.xml"
          bash scripts/test-thor-recents-resilience.sh "$RUNNER_TEMP/taildns-merged-manifest.xml"
          (cd "$core_dir" && env CGO_ENABLED=0 GOOS=windows GOARCH=amd64 "$go_bin" build -trimpath -o "$RUNNER_TEMP/taildns.exe" ./cmd/taildns)
          (cd "$core_dir" && env CGO_ENABLED=0 GOOS=windows GOARCH=amd64 "$go_bin" build -trimpath -o "$RUNNER_TEMP/taildnsd.exe" ./cmd/tailscaled)
          (cd "$core_dir" && env CGO_ENABLED=0 GOOS=windows GOARCH=amd64 "$go_bin" build -trimpath -o "$RUNNER_TEMP/tailscale.exe" ./cmd/tailscale)
