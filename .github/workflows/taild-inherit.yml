name: Inherit TailDNS improvements

on:
  schedule:
    - cron: '25 4 * * *'
  workflow_dispatch:
    inputs:
      inherited_checks:
        description: Also build inherited Android and shared core when already synchronized
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: taild-inherit-main
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Darkaxt/TailD' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      base: ${{ steps.merge.outputs.base }}
      upstream: ${{ steps.merge.outputs.upstream }}
      candidate: ${{ steps.merge.outputs.candidate }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture TailDNS main and prepare non-destructive merge
        id: merge
        run: |
          set -euo pipefail
          git config user.name 'TailD upstream sync'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add taildns https://github.com/Darkaxt/TailDNS.git
          git fetch --no-tags taildns main:refs/remotes/taildns/main
          python3 -B scripts/taild/inherit.py --output "$GITHUB_OUTPUT"
      - name: Check merged TailD and inherited contracts
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/taild -p 'test_*.py' -v
          bash scripts/test-append-taildns-version.sh
          bash scripts/test-taildns-branding.sh
          bash scripts/test-thor-recents-resilience.sh
          bash scripts/test-sync-core-toolchain-rev.sh
          pwsh -NoProfile -File scripts/test-windows-inplace-upgrade.ps1
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        if: steps.merge.outputs.source_changed == 'true' || inputs.inherited_checks == true
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        if: steps.merge.outputs.source_changed == 'true' || inputs.inherited_checks == true
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify inherited Android, DNS and shared Windows core without signing
        if: steps.merge.outputs.source_changed == 'true' || inputs.inherited_checks == true
        run: |
          set -euo pipefail
          GOTOOLCHAIN=local go mod download tailscale.com
          core_dir="$(GOTOOLCHAIN=local go list -m -f '{{.Dir}}' tailscale.com)"
          bash scripts/sync-core-toolchain-rev.sh --check "$core_dir" "$PWD"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;23.1.7779620'
          version_code_base="$(( $(git show -s --format=%ct HEAD) / 60 * 10 ))"
          test "$version_code_base" -lt 2147483640
          VERSION_CODE_BASE="$version_code_base" make version libtailscale
          make go-test
          core_dir="$(./tool/go list -m -f '{{.Dir}}' tailscale.com)"
          go_bin="$(./tool/go env GOROOT)/bin/go"
          (cd "$core_dir" && "$go_bin" test -mod=readonly ./ipn/... ./net/dns/... ./client/local ./cmd/taildns ./safesocket -count=1)
          (cd android && ./gradlew ktfmtCheck test assembleRelease --max-workers=2 --no-parallel '-Dorg.gradle.jvmargs=-Xms512m -Xmx3g' '-Dkotlin.daemon.jvm.options=-Xmx3g' -PVERSION_CODE_BASE="$version_code_base")
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print android/build/outputs/apk/release/android-release-unsigned.apk > "$RUNNER_TEMP/manifest.xml"
          bash scripts/test-thor-recents-resilience.sh "$RUNNER_TEMP/manifest.xml"
          for command in taildns tailscaled tailscale taildns-ipn taildns-installer; do
            (cd "$core_dir" && env CGO_ENABLED=0 GOOS=windows GOARCH=amd64 "$go_bin" build -trimpath -o "$RUNNER_TEMP/$command.exe" "./cmd/$command")
          done
      - name: Preserve exact checked Git candidate
        if: steps.merge.outputs.changed == 'true'
        run: git bundle create "$RUNNER_TEMP/candidate.bundle" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.merge.outputs.changed == 'true'
        with:
          name: checked-candidate
          path: ${{ runner.temp }}/candidate.bundle
          if-no-files-found: error
          retention-days: 1

  promote:
    needs: verify
    if: needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: checked-candidate
          path: ${{ runner.temp }}/checked
      # No candidate repository scripts or build tools execute in this write job.
      - name: Promote only the verified merge with ordinary fast-forward semantics
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.verify.outputs.base }}
          UPSTREAM: ${{ needs.verify.outputs.upstream }}
          CANDIDATE: ${{ needs.verify.outputs.candidate }}
        run: |
          set -euo pipefail
          [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$UPSTREAM" =~ ^[0-9a-f]{40}$ && "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --paginate --jq '.workflows[] | select(.path | startswith(".github/workflows/taild-") | not) | .state' | while read -r state; do
            [[ "$state" == disabled_* ]]
          done
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git bundle verify "$RUNNER_TEMP/checked/candidate.bundle"
          git fetch "$RUNNER_TEMP/checked/candidate.bundle" HEAD:refs/heads/checked-candidate
          test "$(git rev-parse checked-candidate)" = "$CANDIDATE"
          test "$(git show -s --format=%P "$CANDIDATE")" = "$BASE $UPSTREAM"
          git merge-base --is-ancestor "$BASE" "$CANDIDATE"
          git merge-base --is-ancestor "$UPSTREAM" "$CANDIDATE"
          git push origin "$CANDIDATE:refs/heads/main"
