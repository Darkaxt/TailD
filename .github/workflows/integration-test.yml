name: Integration Test

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  integration-test:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-integration-test'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      report: ${{ steps.report.outputs.report }}

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build Docker build image
        run: make docker-build-image

      - name: Build debug APK
        # The emulator is x86_64, so skip building Go for the other ABIs.
        run: make docker-tailscale-debug GOMOBILE_TARGET=android/amd64

      - name: Build Docker test image
        run: make docker-build-android-integration-image

      - name: Run integration test
        env:
          TS_TESTWRAPPER_RESULTS_SUMMARY: "1"
        shell: bash
        run: make android-integration-test-run 2>&1 | tee "integration-test-${GITHUB_RUN_ATTEMPT}.log"

      - name: Report test results
        id: report
        if: always()
        continue-on-error: true
        uses: ./.github/actions/android-test-report
        with:
          check: integration-test

